version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dams-belleza-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/dams_belleza?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - STORE_NAME=Dam's belleza
      - WHATSAPP_NUMBER=${WHATSAPP_NUMBER}
      - RUN_SEED_ON_BOOT=false
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: dams-belleza-db-prod
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dams_belleza
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dams_belleza"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
